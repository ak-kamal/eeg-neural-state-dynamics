[project]
name = "eeg-neural-state-dynamics"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "hmmlearn>=0.3.3",
    "matplotlib>=3.11.2",
    "mne>=1.13.2",
    "mne-bids>=0.19.0",
    "mne-icalabel>=0.10.0",
    "numpy>=2.4.6",
    "onnxruntime>=1.31.0",
    "pandas>=3.0.6",
    "python-picard>=0.8.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eeg_state"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that require fitting ICA or other expensive operations",
]